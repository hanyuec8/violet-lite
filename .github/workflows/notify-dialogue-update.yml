name: Monitor Upstream Dialogue Records

on:
  schedule:
    # 매 6시간마다 실행 (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_notify:
        description: '강제 Discord 알림 발송 (테스트 및 수동 점검)'
        type: boolean
        required: false
        default: false

jobs:
  monitor-dialogue:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Dialogue Monitor
        id: monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_NOTICE_WEBHOOK || '' }}
        run: |
          FORCE_FLAG=""
          if [ "${{ inputs.force_notify }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python tools/monitor_dialogue_records.py $FORCE_FLAG

      - name: Commit and Push State Updates
        if: steps.monitor.outputs.has_update == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/state/fscm_monitor_state.json
          git commit -m "chore(monitor): update upstream dialogue records state [skip ci]"
          git push

[package]
name = "rust_lib_violet"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.11.1"
sevenz-rust = { version = "0.6.1" }
lz4_flex = { version = "0.11", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
ahash = "0.8"
memchr = "2"
rapidfuzz = "0.5"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1.38.2" }

# Debug 빌드(flutter run)에서도 이미지 디코딩·전처리가 2초씩 걸리지 않도록 최적화 활성화
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
